name: Feature request
description: Something AskKit could do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're building, and where AskKit falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: An API sketch helps. Read the house rules and the rejected designs in `docs/ARCHITECTURE.md` first. A request that breaks a house rule needs to say why.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
